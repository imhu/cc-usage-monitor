name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify code and run tests
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows binaries (amd64 & arm64)
        env:
          GOTOOLCHAIN: auto
          CGO_ENABLED: '0'
        run: |
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archives = @()
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOOS = 'windows'
            $env:GOARCH = $arch
            $stage = "dist\windows-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            go build -trimpath -tags "mygo_nowebview mygo_noinspector" -ldflags "-H=windowsgui -s -w" -o "$stage\ccmonitor.exe" .\cmd\ccmonitor
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item README.md "$stage\README.md"
            $zip = "dist\cc-usage-monitor-$tag-windows-$arch.zip"
            Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
            $archives += $zip
          }
          $sums = foreach ($file in $archives) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            "$h  $(Split-Path -Leaf $file)"
          }
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path 'dist').Path 'SHA256SUMS.txt'), ($sums -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create "$tag" `
            "dist\cc-usage-monitor-$tag-windows-amd64.zip" `
            "dist\cc-usage-monitor-$tag-windows-arm64.zip" `
            "dist\SHA256SUMS.txt" `
            --title "Usage Monitor $tag" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
